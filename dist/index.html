<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阿發｜接續流程 Streaming 比較</title>
<link rel="stylesheet" href="app.css">
<style>
/* Minimal comparison controls; original Afa components retain dist/app.css. */
html,body{min-width:320px;min-height:100%;}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:18px 12px 28px;background:#f6f6f8;}
.demo-layout{display:flex;width:min(680px,100%);align-items:flex-start;justify-content:center;gap:20px;}
.delay-panel{width:188px;flex:none;margin-top:115px;padding:14px 13px;border:1px solid #e7e6ef;border-radius:12px;background:rgb(255 255 255 / 92%);box-shadow:0 2px 9px rgb(27 31 68 / 6%);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
.delay-panel-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;color:#3a3a3a;font-size:12px;line-height:18px;}
.delay-panel-heading > span{font-weight:500;}
.delay-panel-value{flex:none;color:#4f44c3;font-size:13px;font-weight:600;white-space:nowrap;}
.delay-group + .delay-group{margin-top:14px;padding-top:12px;border-top:1px solid #efeef5;}
.delay-group-hint{display:block;margin-top:1px;color:#8a8a99;font-size:11px;font-weight:400;line-height:15px;}
.delay-options{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin-top:8px;}
.flow-stream-heading{margin-top:12px;}
.delay-options.flow-stream-options{grid-template-columns:repeat(2,1fr);}
.delay-option{appearance:none;min-width:0;min-height:44px;padding:8px 4px;border:1px solid #dddde9;border-radius:999px;background:#fff;color:#555;font-family:inherit;font-size:12px;line-height:18px;white-space:nowrap;cursor:pointer;touch-action:manipulation;}
.delay-option[aria-pressed=true]{border-color:#4f44c3;background:#f5f3ff;color:#4f44c3;font-weight:600;box-shadow:inset 0 0 0 1px #4f44c3;}
.delay-option:focus-visible{outline:2px solid #4f44c3;outline-offset:2px;}
.delay-confirm{appearance:none;width:100%;min-height:44px;margin-top:8px;padding:8px 12px;border:0;border-radius:999px;background:#4f44c3;color:#fff;font-family:inherit;font-size:13px;font-weight:600;line-height:18px;cursor:pointer;touch-action:manipulation;}
.delay-confirm:focus-visible{outline:2px solid #4f44c3;outline-offset:2px;}
.error-group{margin-top:14px;padding-top:12px;border-top:1px solid #efeef5;}
.error-group + .delay-confirm{margin-top:14px;}
.phone-demo{position:relative;display:flex;width:min(393px,100%);flex:none;flex-direction:column;gap:12px;}
.compare-bar{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;align-items:stretch;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
.compare-choice{min-width:0;padding:10px 8px;border:1px solid #dddde9;border-radius:11px;background:#fff;color:#3a3a3a;text-align:center;cursor:pointer;font-size:12px;line-height:18px;}
.compare-choice small{display:block;margin-top:1px;font-size:10px;font-weight:400;line-height:14px;opacity:.75;white-space:nowrap;}
.compare-choice[aria-pressed=true]{border-color:#4f44c3;background:#f5f3ff;color:#4f44c3;font-weight:600;box-shadow:inset 0 0 0 1px #4f44c3;}
.compare-replay{min-width:0;padding:0 8px;border:1px solid #dddde9;border-radius:11px;background:white;color:#4f44c3;font-size:13px;cursor:pointer;}
.compare-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
.compare-status strong{color:#4f44c3;font-weight:500;}
.app{max-width:100%;}
/* The Safari mockup leaves the phone's lower safe area visible; tint it to match the supplied reference instead of exposing a flat white strip. */
.app{background:linear-gradient(180deg,#fff 0%,#fff 78%,#f4f6f9 100%);}
/* Keep the last streamed reply above the original composer overlay. */
.chat-screen{padding-bottom:56px;}
.chat-scroll-spacer{display:block;flex:none;width:1px;pointer-events:none;}
.chat-scroll-latest{position:absolute;z-index:3;bottom:218px;left:50%;display:flex;width:45px;height:45px;align-items:center;justify-content:center;transform:translateX(-50%);border:0;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgb(27 31 68 / 16%);cursor:pointer;touch-action:manipulation;}
.chat-scroll-latest[hidden]{display:none;}
.chat-scroll-latest img{display:block;width:24px;height:24px;filter:invert(28%) sepia(41%) saturate(1811%) hue-rotate(212deg) brightness(92%) contrast(91%);}
.claim-details-bubble li.stream-item-pending{display:none;}
/* Keep the assistant send time on one line beneath its card. */
.assistant-content .chat-meta{width:max-content;min-width:max-content;}
.assistant-content .chat-meta .chat-time{width:auto;white-space:nowrap;}
.message-loading{display:flex;gap:8px;align-items:flex-start;padding:0 16px;flex:none;}
.message-loading-content{display:flex;flex:1;max-width:305px;min-width:0;align-items:flex-start;padding:0;}
.message-loading-bubble{display:flex;width:max-content;max-width:100%;min-height:48px;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border:1px solid rgb(224 224 224 / 8%);border-radius:10px;background:linear-gradient(133.77deg,#fff 8.1421%,rgb(255 255 255 / 50%) 95.691%);box-shadow:0 2px 9px rgb(27 31 68 / 8%);-webkit-backdrop-filter:blur(27.5px);backdrop-filter:blur(27.5px);font-size:16px;font-weight:400;line-height:22px;letter-spacing:.3px;white-space:nowrap;transition:opacity var(--loading-fade-duration,100ms) ease-in-out;}
.message-loading-bubble.loading-fade-out{opacity:0;}
.message-loading-spark-spin{display:block;flex:none;width:20px;height:20px;animation:loading-spark-rotate 2s linear infinite;}
.message-loading-spark{display:block;width:100%;height:100%;transform-origin:center;animation:loading-spark-pulse 2s ease-in-out infinite;}
.message-loading-label{opacity:.58;animation:thinking-breathe 1s ease-in-out infinite;}
@keyframes thinking-breathe{0%,100%{opacity:.58}50%{opacity:1}}
@keyframes loading-spark-rotate{to{transform:rotate(360deg)}}
@keyframes loading-spark-pulse{0%,100%{transform:scale(.84)}50%{transform:scale(1.14)}}
.chat-actions{width:max-content;max-width:100%;align-items:flex-start;}
.chat-actions > button.chat-action.afa-figma-button{appearance:none;width:max-content;max-width:100%;min-height:38px;padding:8px 24px;border:1px solid rgb(224 224 224 / 35%);border-radius:22px;color:#4f44c3;background:linear-gradient(133.77deg,#fff 8.1421%,rgb(255 255 255 / 75%) 95.691%);box-shadow:0 2px 9px rgb(27 31 68 / 8%);-webkit-backdrop-filter:blur(27.5px);backdrop-filter:blur(27.5px);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;font-size:16px;line-height:22px;letter-spacing:.3px;text-align:center;}
.chat-actions > button.chat-action.afa-figma-button:hover{color:#4f44c3;background:linear-gradient(133.77deg,#fff 8.1421%,rgb(255 255 255 / 88%) 95.691%);}
.chat-actions.figma-quick-replies{display:flex;flex-flow:row nowrap;align-items:center;gap:8px;width:100%;margin-top:10px;padding-left:0;}
.chat-actions.figma-quick-replies > button.chat-action.afa-figma-button{width:auto;min-width:0;min-height:38px;padding:7px 16px;border:0;color:#454545;background:linear-gradient(133.77deg,#fff 8.1421%,rgb(255 255 255 / 72%) 95.691%);box-shadow:0 2px 9px rgb(27 31 68 / 8%);white-space:nowrap;}
.claim-contact-line{display:block;white-space:nowrap;}
.claim-support-link{display:inline-flex;align-items:center;gap:3px;color:#1688e8;text-decoration:none;white-space:nowrap;}
.claim-support-link img{display:block;width:13px;height:13px;flex:none;}
.send-button.is-paused{position:relative;opacity:.5;}
.send-button.is-paused img{opacity:0;}
/* Input/MessageBar Status=pause（Figma 21477:5109）：思考中到回覆完成、以及需先點上方按鈕時使用。 */
.send-button.is-paused::before{content:"";position:absolute;inset:0;border-radius:50%;background:url(assets/send-pause-bg.svg) center/40px 40px no-repeat;}
.send-button.is-paused::after{content:"";position:absolute;z-index:1;width:12px;height:12px;border-radius:2px;background:#3a3a3a;}
.claim-support-link:hover{text-decoration:underline;}
.stream-caret{display:inline-block;width:2px;height:16px;background:#4f44c3;vertical-align:-3px;margin-left:2px;animation:blink .8s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
/* E/F/G reveal modes. Blocks not yet revealed are removed from layout so the reply grows downward. */
.reveal-pending{display:none !important;}
.reveal-fade{animation:reveal-fade var(--reveal-fade-ms,360ms) ease-out both;}
.reveal-blur{animation:reveal-blur var(--reveal-blur-ms,560ms) ease-out both;}
@keyframes reveal-fade{from{opacity:0}to{opacity:1}}
@keyframes reveal-blur{from{opacity:0;filter:blur(6px);transform:translateY(4px)}to{opacity:1;filter:blur(0);transform:none}}
/* 新情境測試（查帳單）：依 Figma【Next-Chatbot】Library「APP_查帳單_已入帳明細_未繳款_未設定自扣」。 */
.brand-chevron{display:block;flex:none;width:24px;height:24px;}
.brand-chevron[hidden],.beta[hidden]{display:none;}
.assistant-content.bill-reply{gap:16px;}
.bill-card{width:305px;max-width:100%;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 2px 9px rgb(27 31 68 / 8%);color:#3a3a3a;}
.bill-statement{display:flex;flex-direction:column;gap:12px;padding:16px;}
.bill-total{display:flex;flex-direction:column;gap:2px;text-align:center;}
.bill-total-label{margin:0;font-size:14px;font-weight:500;line-height:20px;letter-spacing:.042px;}
.bill-total-amount{margin:0;font-size:20px;font-weight:600;line-height:24px;letter-spacing:.3px;}
.bill-row{display:flex;justify-content:space-between;gap:8px;margin:0;font-size:14px;line-height:20px;letter-spacing:.3px;}
.bill-row.is-strong{font-weight:500;letter-spacing:.042px;}
.bill-row span:last-child{text-align:right;}
.bill-note{margin:0 16px 12px;color:#4f44c3;font-size:12px;}
.bill-link{color:#009eff;font-weight:500;text-decoration:none;}
.bill-link:hover{text-decoration:underline;}
.bill-meta{display:flex;width:299px;max-width:100%;height:24px;align-items:center;justify-content:space-between;margin-top:-8px;}
.bill-meta .chat-time{margin:0;white-space:nowrap;}
.bill-feedback{display:flex;gap:12px;}
.bill-feedback button{appearance:none;width:24px;height:24px;padding:0;border:0;border-radius:4px;background:none;cursor:pointer;}
.bill-feedback button[aria-pressed=true]{background:#f0eeff;}
.bill-feedback img{display:block;width:24px;height:24px;}
.bill-suggest{display:flex;flex-direction:column;gap:12px;}
.bill-suggest-heading{display:flex;align-items:center;gap:4px;margin:0;color:#777;font-size:14px;line-height:20px;letter-spacing:.3px;}
.bill-suggest-star{display:flex;width:15px;height:15px;align-items:center;justify-content:center;flex:none;}
.bill-suggest-q{appearance:none;display:flex;align-items:center;gap:8px;padding:2px 0;border:0;background:none;color:#3a3a3a;font-family:inherit;font-size:16px;line-height:22px;letter-spacing:.3px;text-align:left;cursor:pointer;}
.bill-suggest-q img{display:block;width:24px;height:24px;flex:none;}
@media(max-width:700px){.demo-layout{width:min(393px,100%);flex-direction:column;align-items:stretch;gap:8px}.delay-panel{width:100%;margin:0;padding:10px 12px}.delay-panel-heading{margin-bottom:5px}.delay-options{grid-template-columns:repeat(5,1fr)}.delay-group + .delay-group{margin-top:10px;padding-top:10px}}
@media(max-width:440px){body{padding:10px 0 22px;gap:8px}.compare-bar,.compare-status{width:calc(100% - 18px)}.app{border-radius:0}.compare-choice{padding:10px 4px;font-size:11px}}
@media(prefers-reduced-motion:reduce){.stream-caret,.message-loading-label,.message-loading-spark-spin,.message-loading-spark,.reveal-fade,.reveal-blur{animation:none;}.message-loading-bubble{transition:none;}}
</style>
</head>
<body>
<div class="demo-layout">
<aside class="delay-panel" aria-label="回覆等待時間設定">
  <div class="delay-group" data-wait-group="consult">
    <div class="delay-panel-heading"><span>諮詢等待<small class="delay-group-hint">一問一答</small></span><output class="delay-panel-value" data-wait-value="consult" aria-live="polite">3 秒</output></div>
    <div class="delay-options" role="group" aria-label="諮詢等待秒數">
      <button type="button" class="delay-option" data-wait-kind="consult" data-wait-index="0" aria-pressed="true">3 秒</button>
      <button type="button" class="delay-option" data-wait-kind="consult" data-wait-index="1" aria-pressed="false">5 秒</button>
      <button type="button" class="delay-option" data-wait-kind="consult" data-wait-index="2" aria-pressed="false">10 秒</button>
    </div>
  </div>
  <div class="delay-group" data-wait-group="flow">
    <div class="delay-panel-heading"><span>流程等待<small class="delay-group-hint">一問多則：訊息＋卡片</small></span><output class="delay-panel-value" data-wait-value="flow" aria-live="polite">1 秒</output></div>
    <div class="delay-options" role="group" aria-label="流程等待秒數">
      <button type="button" class="delay-option" data-wait-kind="flow" data-wait-index="0" aria-pressed="true">1 秒</button>
      <button type="button" class="delay-option" data-wait-kind="flow" data-wait-index="1" aria-pressed="false">5 秒</button>
      <button type="button" class="delay-option" data-wait-kind="flow" data-wait-index="2" aria-pressed="false">10 秒</button>
    </div>
  </div>
  <div class="error-group">
    <div class="delay-panel-heading"><span>下一則訊息 Error<small class="delay-group-hint">立即套用；選「是」時每則回覆都會 Error</small></span></div>
    <div class="delay-options flow-stream-options" role="group" aria-label="下一則訊息是否 Error">
      <button type="button" class="delay-option" data-error-next="off" aria-pressed="true">否</button>
      <button type="button" class="delay-option" data-error-next="on" aria-pressed="false">是</button>
    </div>
  </div>
  <button type="button" class="delay-confirm" id="confirm-wait">確認</button>
</aside>
<div class="phone-demo">
<div class="compare-bar" aria-label="選擇預設樣式">
<button type="button" class="compare-choice" data-preset="1" aria-pressed="false" title="班機延誤劇本｜Error 後以逐詞淡入重新呈現">Streaming 示範 1<small>Error：逐詞淡入</small></button>
<button type="button" class="compare-choice" data-preset="2" aria-pressed="true" title="班機延誤劇本｜Error 後整則模糊轉清晰">Streaming 示範 2<small>Error：整則模糊</small></button>
<button type="button" class="compare-choice" data-preset="3" aria-pressed="false" title="查帳單劇本｜Error 後整則模糊轉清晰">複雜情境演示<small>查帳單</small></button>
<button type="button" class="compare-replay" id="replay" aria-label="重新播放">↻ 重播</button>
</div>
<div class="compare-status" role="status" aria-live="polite"><span>iPhone 393 × 852</span><strong id="status">準備開始</strong></div>
<main class="app is-chat" aria-label="國泰產險智能助理阿發">
  <div class="system-glow" aria-hidden="true"><img src="assets/system-bg.svg" alt=""></div>
  <div class="phone-chrome" aria-hidden="true"><img src="assets/ios-safari-chrome.svg" alt=""></div>
  <header class="top"><div class="brand-row"><p class="brand-name">國泰產險智能助理阿發</p><span class="beta">Beta</span><img class="brand-chevron" src="assets/bill-arrow-black.svg" alt="" hidden></div></header>
  <section class="chat-screen" id="chat-screen" aria-label="班機延誤諮詢對話" aria-live="polite"></section>
  <button type="button" class="chat-scroll-latest" id="scroll-latest" aria-label="捲動至最新訊息" title="捲動至最新訊息" hidden><img src="assets/Direction=down.svg" alt=""></button>
  <footer class="composer">
    <form class="composer-form">
      <div class="message-field"><img class="field-art" src="assets/input-field.svg" alt=""><input class="message-input" type="text" placeholder="告訴我你想做什麼" disabled aria-label="告訴我你想做什麼"></div>
      <button class="send-button" type="submit" aria-label="傳送" disabled><img src="assets/send.svg" alt=""></button>
    </form>
    <p class="message-note">當您傳送訊息，即表示同意「AI告知聲明」。本服務由AI提供，<br>內容僅供參考，實際資訊仍以國泰產險官網公告為準。</p>
  </footer>
</main>
</div>
</div>
<script>
(() => {
  'use strict';
  const $ = sel => document.querySelector(sel);
  const chat = $('#chat-screen');
  const scrollLatest = $('#scroll-latest');
  const status = $('#status');
  const waitValues = {consult:$('[data-wait-value="consult"]'),flow:$('[data-wait-value="flow"]')};
  const waitButtons = Array.from(document.querySelectorAll('[data-wait-index]'));
  const confirmWaitButton = $('#confirm-wait');
  const composerForm = $('.composer-form');
  const messageInput = $('.message-input');
  const sendButton = $('.send-button');
  const presetButtons = Array.from(document.querySelectorAll('[data-preset]'));
  const errorNextButtons = Array.from(document.querySelectorAll('[data-error-next]'));
  // 廠商展示版：面板沒有 Error 樣式與流程 Streaming，兩者由上方按鈕決定；按鈕顯示最後選的那一個。
  let activePreset = '2';
  const APPLICATION_MESSAGE = '我要申請';
  const BANK_ACCOUNT_QUESTION = '本人匯款帳戶有什麼要求';
  const FIRST_CONSULTATION = {
    user: '我想詢問班機延誤相關問題',
    sentAt: '10:07 PM',
    answer: '阿發為你整理常見問題：\n1. 班機延誤多久可以申請理賠？延誤 4 小時以上，才可提出理賠申請。\n2. 班機取消可以走這個流程嗎？本流程不適用，請改由產險官網或線下通路辦理。\n3. 改搭其他班機可以走這個流程嗎？本流程不適用，請改由產險官網或線下通路辦理。\n4. 錯過轉機可以走這個流程嗎？本流程不適用，請改由產險官網或線下通路辦理。\n5. 申請前需要準備什麼？登機證、本人匯款帳戶；班機延誤證明視情況提供。\n6. 申請人與申請期限有哪些條件？限個人件，且要保人與被保險人須為同一人，並於班機延誤發生後二年內提出。\n7. 申請前需要是國泰產險會員嗎？需要，實際資格與理賠內容仍依投保方案、保單條款及官網公告為準。'
  };
  const FOLLOWUP_CONSULTATION = {
    user: '班機延誤 2 個半小時，可以申請理賠嗎？',
    sentAt: '10:10 PM',
    answer: '以國泰產險旅遊不便險的班機延誤定額保障為例，須延誤 4 小時以上才符合時間門檻；單純延誤 2 個半小時，依這項保障條件尚未達門檻。同一事故的延誤、取消或轉機失接期間可能合併計算，所以仍要依保單條款、實際航班狀況與相關證明判定。建議先核對投保方案，並保留登機證及航班異動或延誤證明；不同方案的條件可能不同，最終仍以保單條款與產險官網公告為準。'
  };
  const FOURTH_USER_PROMPT = '我想確認同一事故的延誤時間怎麼計算';
  const FOURTH_ASSISTANT_ANSWER = '班機延誤、取消或轉機失接若屬同一事故，相關期間可能合併計算。建議先確認每一段航班的預定與實際起飛時間，再依投保方案及保單條款核對。';
  const FIFTH_ANSWERS = {
    '查理賠條件': {
      answer: '以國泰產險旅遊不便險的班機延誤定額保障為例，延誤須達 4 小時以上；若合併計算後仍未達門檻，依這項保障條件尚不符合申請資格。實際保障仍以您的投保方案及保單條款為準。如需進一步確認，歡迎聯繫國泰產險客服。',
      phone: '02-2755-1299',
      landline: '0800-212-880'
    },
    '查國泰產險營業據點': {
      answer: '可至國泰產險官方網站查詢各營業據點地址與服務資訊。前往前建議先確認據點的營業時間及可辦理項目。'
    }
  };
  const BANK_ACCOUNT_ANSWER = '匯款帳戶請使用申請人本人名義，送出前確認帳戶資料正確；實際受理方式依申請頁面及投保方案為準。';
  const FADE_CHAR_MS = 20; // F 逐詞淡入：每字 20ms
  const FLOW_PREVIEW_PAUSE_MS = 1200;
  const WAIT_OPTIONS = {consult:[3,5,10],flow:[1,5,10]};

    });
  }
  function applicationReply(style,token,done,partial) {
    const node=replyRow('10:09 PM',style),{bubble}=details(),textStyle=flowTextStyle(style);
    const chars=Array.from(bubble.textContent).length;
    node.column.append(bubble);
    presentStructured(bubble,textStyle,token,()=>{
      if(partial)return;
      appendBlock(node.column,card());appendMeta(node);status.textContent='流程：申請流程回覆完成';scroll();done();
    });
    return {node,chars,direct:textStyle==='instant'};
  }
  function bankReply(style,token,done,partial) {
    const node=replyRow('10:10 PM',style),bubble=el('div','assistant-bubble'),paragraph=el('p'),textStyle=flowTextStyle(style);
    bubble.append(paragraph);node.column.append(bubble);
    presentText(paragraph,BANK_ACCOUNT_ANSWER,textStyle,token,()=>{
      if(partial)return;
      appendBlock(node.column,bankReviewCard());appendMeta(node);scroll();done();
    });
    return {node,chars:Array.from(BANK_ACCOUNT_ANSWER).length,direct:textStyle==='instant'};
  }
  function continueFlow(token) {
    respond(token,'flow',mode,applicationReply,()=>{
      prepareMessage(BANK_ACCOUNT_QUESTION,'10:10 PM',()=>{
        respond(token,'flow',mode,bankReply,()=>schedule(()=>prepareFollowup(token),FLOW_PREVIEW_PAUSE_MS,token));
      },'已預填匯款帳戶問題，請點選傳送');
    });
  }
  function prepareFollowup(token) {
    prepareMessage(FOLLOWUP_CONSULTATION.user,FOLLOWUP_CONSULTATION.sentAt,()=>{
      respond(token,'consult',mode,textReply(FOLLOWUP_CONSULTATION.sentAt,FOLLOWUP_CONSULTATION.answer,appendMeta),()=>prepareFourthUserMessage(token));
    },'已預填後續問題，請點選傳送');
  }
  function prepareFourthUserMessage(token) {
    prepareMessage(FOURTH_USER_PROMPT,'10:11 PM',()=>showFourthAnswer(token),'已預填追問，請點選傳送');
  }
  function showFourthAnswer(token) {
    respond(token,'consult',mode,textReply('10:11 PM',FOURTH_ASSISTANT_ANSWER,(node,paragraph,style)=>{
      appendMeta(node);
      const actions=el('div','chat-actions figma-quick-replies');
      Object.keys(FIFTH_ANSWERS).forEach(label=>{
        const button=el('button','chat-action afa-figma-button',label);button.type='button';
        button.addEventListener('click',()=>{
          actions.querySelectorAll('button').forEach(option=>option.disabled=true);
          setComposerPaused(false);
          userMessage(label,'10:11 PM');followLatest=false;
          showFifthAnswer(FIFTH_ANSWERS[label],token);
        });
        actions.append(button);
      });
      appendBlock(node.column,actions);status.textContent='請選擇後續處理方式';
    }),()=>setComposerPaused(true));
  }
  function showFifthAnswer(item,token) {
    respond(token,'consult',mode,textReply('10:12 PM',item.answer,(node,paragraph)=>{appendContactLines(paragraph,item);appendMeta(node);}),()=>{status.textContent='諮詢完成';});
  }
  // 新情境測試（查帳單）：一問多則（流程）——泡泡 → 帳單卡 → 提醒泡泡（含連結）→ 時間／讚 → 你可能想問。
  function demoFeedback(parent,label,cls='bill-note') {
    const message=parent.querySelector('[data-test-feedback]')||el('p',cls);
    message.dataset.testFeedback='true';message.textContent=`已選取「${label}」（僅供展示）`;parent.append(message);scroll();
  }
  function img(src,cls) { const node=el('img',cls);node.src=src;node.alt='';return node; }
  function billCard() {
    const wrapper=el('div','bill-card'),statement=el('div','bill-statement');
    const total=el('div','bill-total');total.append(el('p','bill-total-label',BILL.totalLabel),el('p','bill-total-amount',BILL.total));
    statement.append(total);
    BILL.rows.forEach(([label,value,strong])=>{const row=el('p',strong?'bill-row is-strong':'bill-row');row.append(el('span',null,label),el('span',null,value));statement.append(row);});
    wrapper.append(statement);return wrapper;
  }
  function billMeta(sentAt) {
    const meta=el('div','bill-meta'),feedback=el('div','bill-feedback');
    [['讚','assets/ic-thumb-up.svg'],['倒讚','assets/ic-thumb-down.svg']].forEach(([label,src])=>{
      const button=el('button');button.type='button';button.setAttribute('aria-label',label);button.setAttribute('aria-pressed','false');button.append(img(src));
      button.addEventListener('click',()=>{const on=button.getAttribute('aria-pressed')!=='true';feedback.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed',String(on));});
      feedback.append(button);
    });
    meta.append(el('p','chat-time',`${sentAt} 送出`),feedback);return meta;
  }
  function billSuggestions() {
    const box=el('div','bill-suggest'),heading=el('p','bill-suggest-heading'),star=el('span','bill-suggest-star');
    star.append(img('assets/suggest-star.svg'));heading.append(star,'你可能想問');box.append(heading);
    BILL.suggestions.forEach((label,index)=>{
      const button=el('button','bill-suggest-q',label);button.type='button';
      button.append(img(index===0?'assets/ic-arrow-grey.svg':'assets/ic-arrow-grey-s.svg'));
      button.addEventListener('click',()=>demoFeedback(box,label));box.append(button);
    });
    return box;
  }
  function billReply(style,token,done,partial) {
    const node=replyRow(BILL.sentAt,style),textStyle=flowTextStyle(style);
    node.column.classList.add('bill-reply');
    const intro=el('div','assistant-bubble'),introText=el('p');intro.append(introText);node.column.append(intro);
    presentText(introText,BILL.intro,textStyle,token,()=>{
      if(partial)return;
      appendBlock(node.column,billCard());
      const reminder=el('div','assistant-bubble'),reminderText=el('p');reminder.append(reminderText);node.column.append(reminder);
      presentText(reminderText,BILL.reminder,textStyle,token,()=>{
        const link=el('a','bill-link',BILL.linkLabel);link.href='#';
        link.addEventListener('click',event=>{event.preventDefault();demoFeedback(reminder,BILL.linkLabel,'');});
        if(textStyle==='fade')link.classList.add('reveal-fade');else if(textStyle==='blur')link.classList.add('reveal-blur');
        reminderText.append(link);
        appendBlock(node.column,billMeta(BILL.sentAt));
        appendBlock(node.column,billSuggestions());
        status.textContent='流程：查帳單回覆完成';scroll();done();
      });
    });
    // Error 時第一個泡泡讓它完整出現後停留 1 秒再收回（帳單卡尚未出現）。
    const chars=Array.from(BILL.intro).length;
    return {node,chars,direct:textStyle==='instant',holdMs:textStyle==='instant'?ERROR_DIRECT_HOLD_MS:chars*FADE_CHAR_MS+ERROR_DIRECT_HOLD_MS};
  }
  function startBill(token) {
    userMessage(BILL.user,BILL.sentAt);
    respond(token,'flow',mode,billReply,()=>{});
  }
  function start() {
    generation++;const token={gen:generation};
    timers.forEach(clearTimeout);timers=[];
    pendingSend=null;chat.replaceChildren();
    scrollSpacer=null;followLatest=false;scrollAnchor=null;programmaticScroll=false;clearTimeout(programmaticScrollTimer);scrollLatest.hidden=true;
    messageInput.value='';setComposerPaused(false);
    status.textContent='諮詢內容 Streaming 中';
    if(scenario==='bill')startBill(token);else startConsultation(token);
  }
  composerForm.addEventListener('submit',event=>{
    event.preventDefault();
    const next=pendingSend;
    const message=messageInput.value.trim();
    if(!next||!message)return;
    pendingSend=null;setComposerEnabled(false);
    userMessage(message,next.sentAt);followLatest=false;
    messageInput.value='';
    status.textContent='正在接續申請流程';scroll();
    next.onSend(message);
  });
  chat.addEventListener('scroll',()=>{
    const distanceToBottom=latestScrollTop()-chat.scrollTop;
    if(distanceToBottom<=40){if(!programmaticScroll&&latestScrollTop()>40)followLatest=true;}
    else if(!programmaticScroll)followLatest=false;
    updateScrollButton();
  },{passive:true});
  chat.addEventListener('scrollend',()=>{programmaticScroll=false;},{passive:true});
  scrollLatest.addEventListener('click',()=>{
    followLatest=true;programmaticScroll=true;
    chat.scrollTo({top:latestScrollTop(),behavior:'smooth'});
    clearTimeout(programmaticScrollTimer);
    programmaticScrollTimer=setTimeout(()=>{programmaticScroll=false;updateScrollButton();},1200);
  });
  waitButtons.forEach(button=>button.addEventListener('click',()=>{selectedWaitIndex[button.dataset.waitKind]=Number(button.dataset.waitIndex);updateWaitValue();}));
  confirmWaitButton.addEventListener('click',()=>{Object.assign(activeWaitIndex,selectedWaitIndex);syncPresetButtons();start();});
  // Error 設定立即生效，不需要按「確認」，也不會重播。
  errorNextButtons.forEach(button=>button.addEventListener('click',()=>setErrorNext(button.dataset.errorNext==='on')));
  presetButtons.forEach(button=>button.addEventListener('click',()=>applyPreset(button.dataset.preset)));
  updateWaitValue();
  $('#replay').addEventListener('click',start);
  start();
})();
</script>
</body>
</html>
